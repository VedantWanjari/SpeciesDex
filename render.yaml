services:
  - type: web
    name: speciesdex-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
  - type: web
    name: speciesdex-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

